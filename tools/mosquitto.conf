# Broker MQTT local para el Panel IoT UNAH.
#   /opt/homebrew/opt/mosquitto/sbin/mosquitto -c tools/mosquitto.conf
#   ngrok tcp 1883      -> el ESP32 de Wokwi entra por la dirección que muestre ngrok
# Sin usuario ni clave: sólo para la demo, mientras ngrok esté abierto.
listener 1883
allow_anonymous true
